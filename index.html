<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- NAVBAR : unique sur la page, elle reste en HTML -->
    <nav class="bg-white flex justify-between items-center h-14 px-6 py-2 fixed top-0 left-0 w-full z-50">

        <!-- gauche : menu + logo -->
        <div class="flex justify-center items-center gap-6">
            <i class="fa-solid fa-bars text-xl cursor-pointer hover:text-red-600"></i>
            <img src="images/YouTube-Logo-500x281.png" class="h-14 w-auto" alt="YouTube">
        </div>

        <!-- centre : recherche + micro -->
        <div class="hidden md:flex flex-1 items-center justify-center gap-4">
            <div class="flex flex-1 w-full max-w-[640px] items-center">
                <input type="text" placeholder="Search" class="w-full h-10 bg-transparent border border-gray-300 focus:border-blue-500 focus:outline-none rounded-l-full shadow-inner px-6">
                <button class="border border-gray-300 border-l-0 hover:bg-gray-100 shadow-sm rounded-r-full bg-gray-50 h-10 px-6">
                    <i class="fa-solid fa-magnifying-glass text-sm text-gray-600"></i>
                </button>
            </div>
            <div class="flex justify-center items-center bg-gray-100 w-10 h-10 hover:bg-gray-300 rounded-full transition-colors">
                <i class="fa-solid fa-microphone text-sm text-gray-800"></i>
            </div>
        </div>

        <!-- droite : actions utilisateur -->
        <div class="flex items-center justify-center gap-4 ml-auto">
            <button class="flex md:hidden items-center justify-center w-10 h-10 hover:bg-gray-200 rounded-full cursor-pointer text-xl text-gray-700">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <button class="hidden md:flex items-center justify-center bg-gray-100 px-4 hover:bg-gray-300 gap-2 p-2 rounded-full cursor-pointer">
                <i class="fa-solid fa-plus"></i>
                <p>Create</p>
            </button>

            <button class="relative w-10 h-10 bg-white hover:bg-gray-300 p-2 rounded-full cursor-pointer">
                <i class="fa-solid fa-bell text-xl"></i>
                <span class="absolute top-0.5 right-0.5 flex h-4 w-4 items-center justify-center rounded-full bg-red-600 text-[10px] font-medium text-white px-1">9+</span>
            </button>

            <button class="w-8 h-8 rounded-full ml-1 overflow-hidden focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&h=100&q=80"
                    alt="User avatar" class="w-full h-full object-cover">
            </button>
        </div>
    </nav>

    <div class="flex pt-14">

        <!-- SIDEBAR : remplie par le composant Sidebar -->
        <aside id="sidebar" class="hidden md:block w-60 h-[calc(100vh-56px)] bg-white p-2 sticky top-14 overflow-y-auto"></aside>

        <main class="flex-1">

            <!-- CATÉGORIES : le conteneur sticky reste ici, les boutons viennent du composant -->
            <div class="sticky top-14 bg-white z-40 py-2 overflow-x-auto">
                <div id="categories" class="flex gap-3 w-max px-2"></div>
            </div>

            <!-- GRILLE DE VIDÉOS : remplie par le composant VideoCard -->
            <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mx-4"></div>

        </main>
    </div>

    <!-- type="module" : obligatoire pour import / export -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
