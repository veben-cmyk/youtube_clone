<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <nav class="bg-white flex justify-between items-center h-14  px-6 py-2 fixed top-0 left-0 w-full z-50">

        <!-- left side navbar -->
        
        <div class="flex justify-center items-center gap-6">
            <i class="fa-solid fa-bars text-xl cursor-pointer hover:text-red-600"></i>
            <img src="images/YouTube-Logo-500x281.png" class="h-14 w-auto" alt="youtube">
        </div>

        <!-- center navbar -->

        <div class="hidden md:flex flex-1 items-center justify-center gap-4  ">
            <div class="flex flex-1 w-full max-w-[640px] items-center ">
                <input type="text" placeholder="search" class="w-full h-10 bg-transparent border border-gray-300 focus:border-blue-500 focus:outline-none rounded-l-full shadow-inner px-6">
                <button class="border border-gray-300 border-l-0 hover:bg-gray-100 shadow-sm rounded-r-full bg-gray-50 h-10 px-6">
                    <i class="fa-solid fa-magnifying-glass text-sm text-gray-600"></i>
                </button>
            </div>
            <div class="flex justify-center items-center bg-gray-100 w-10 h-10 hover:bg-gray-300 rounded-full transition-colors">
                <i class="fa-solid fa-microphone text-sm text-gray-800"></i>
            </div>
        </div>

        <!-- right side navbar -->

        <div class="flex items-center justify-center gap-4 ml-auto">

            <button class="flex md:hidden items-center justify-center w-10 h-10 hover:bg-gray-200 rounded-full cursor-pointer text-xl text-gray-700">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <button class="hidden md:flex items-center justify-center bg-gray-100 px-4 hover:bg-gray-300 gap-2 p-2 rounded-l-full rounded-r-full cursor-pointer">
                <i class="fa-solid fa-plus"></i>
                <p>Créer </p>
            </button>

            <button class="relative w-10 h-10 bg-white hover:bg-gray-300 p-2 rounded-full cursor-pointer">
                <i class="fa-solid fa-bell text-xl" ></i>
                <span class="absolute top-0.5 right-0.5 flex h-4 w-4 items-center justify-center rounded-full bg-red-600 text-[10px] font-medium text-white px-1">
                    9+
                </span>
            </button>

            <button class="w-8 h-8 rounded-full ml-1 overflow-hidden focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&h=100&q=80" 
                    alt="Avatar utilisateur" 
                        class="w-full h-full object-cover">
            </button>
            
        </div>

    </nav>

    <div class="flex pt-14">

    <!-- The Sidebar -->

        <aside class="hidden md:block w-60 h-[calc(100vh-56px)] bg-white p-2 sticky top-14 overflow-y-auto hover:overflow-y-auto scrollbar-thin">

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <img src="images/accueil.png" class="h-6 w-auto"
                        alt="youtube-shorts" />
                    <span class="text-sm">home</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <img src="https://img.icons8.com/material-outlined/24/youtube-shorts.png" class="h-6 w-auto"
                        alt="youtube-shorts" />
                    <span class="text-sm">Shorts</span>
                </div>

                <hr class="border-gray-200 my-3">

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-solid fa-layer-group text-lg w-6 text-center"></i>
                    <span class="text-sm">Subscriptions</span>
                </div>
            

                <hr class="border-gray-200 my-3">

            <div class="space-y-0.5">
                <div
                    class="px-4 py-1 text-sm font-semibold text-gray-900 flex items-center gap-2 cursor-pointer rounded-xl hover:bg-gray-100">
                    <span>You</span>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-regular fa-id-card text-lg w-6 text-center"></i>
                    <span class="text-sm">Your channel</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-solid fa-clock-rotate-left text-lg w-6 text-center"></i>
                    <span class="text-sm">History</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <img src="images/play-list.png" class="h-6 w-auto"
                        alt="youtube-shorts" />
                    <span class="text-sm">playlist</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-solid fa-clapperboard text-lg w-6 text-center"></i>
                    <span class="text-sm">Your videos</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-regular fa-clock text-lg w-6 text-center"></i>
                    <span class="text-sm">Watch Later</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-solid fa-thumbs-up text-lg w-6 text-center"></i>
                    <span class="text-sm">Liked videos</span>
                </div>
            </div>

            <hr class="border-gray-200 my-3">

            <div class="space-y-0.5">
                <div class="px-4 py-1 text-sm font-semibold text-gray-900">Explore</div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-solid fa-fire text-lg w-6 text-center"></i>
                    <span class="text-sm">Trending</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-solid fa-bag-shopping text-lg w-6 text-center"></i>
                    <span class="text-sm">Shopping</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-solid fa-music text-lg w-6 text-center"></i>
                    <span class="text-sm">Music</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-solid fa-film text-lg w-6 text-center"></i>
                    <span class="text-sm">Movies</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-solid fa-tower-broadcast text-lg w-6 text-center"></i>
                    <span class="text-sm">Live</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-solid fa-gamepad text-lg w-6 text-center"></i>
                    <span class="text-sm">Gaming</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-regular fa-newspaper text-lg w-6 text-center"></i>
                    <span class="text-sm">News</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-solid fa-trophy text-lg w-6 text-center"></i>
                    <span class="text-sm">Sports</span>
                </div>
            </div>

            <hr class="border-gray-200 my-3">

            <div class="space-y-0.5">
                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-solid fa-gear text-lg w-6 text-center"></i>
                    <span class="text-sm">Settings</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-regular fa-flag text-lg w-6 text-center"></i>
                    <span class="text-sm">Report history</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-regular fa-circle-question text-lg w-6 text-center"></i>
                    <span class="text-sm">Help</span>
                </div>

                <div class="flex items-center gap-5 cursor-pointer hover:bg-gray-100 py-2 px-4 rounded-xl">
                    <i class="fa-solid fa-circle-exclamation text-lg w-6 text-center"></i>
                    <span class="text-sm">Send feedback</span>
                </div>
            </div>

        </aside>

        <!-- TODO: Contenu principal (catégories + grille de vidéos) -->

        </div>
    </div>

</body>
</html>
